<!DOCTYPE html>
<html>

 <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Greeting Card Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
 </head>
 <body>
 <main>
  <section id="order-section">
       <h2>Order a card</h2>
    <label>A name
    <input id="name-input" type="text">
    </label> 
    <label>An adjective
       <input id="adjective-input" type="text">
    </label>
    <label> A noun
          <input id="noun-input" type="text">
    </label>
</section>
<button type="button" id="make-button" > Make my card </button>
<button type="button" id="reset-button">Reset</button>

<section id="card-section" >
  <article>
     <p id="card-text" >Your card will appear here.</p>
     <p id="bonus-line" hidden>You found the hidden gem!</p>
  </article>

   <section>
        <h3>Closing Options</h3>
        <p id="closing-text">Closing Options</p>
    </section>

   <button type="button" id="surprise-button" > Surprise me </button> 
   </section>
</main>
<script src="card.js"></script>
 </body>
</html>
